version: 1
triage:
  enabled: true
review:
  enabled: true
  instructions-file: .github/instructions/pr-review.md
  skip-labeled: true
  paths:
    - worker/**
scan:
  enabled: true
  fail-on: critical,high
ai:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api-key-secret: APTU_AI_API_KEY
