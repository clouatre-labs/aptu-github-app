version: 1
triage:
  enabled: true
review:
  enabled: true
  instructions-file: .github/instructions/pr-review.md
  skip-labeled: true
  paths:
    - worker/**
    - .github/workflows/**
scan:
  enabled: true
  fail-on: critical,high
ai:
  provider: openrouter
  model: deepseek/deepseek-v4.1-flash-1017
