name: Aptu Review

on:
  repository_dispatch:
    types:
      - aptu-review

jobs:
  mask-token:
    name: Mask Installation Token
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
      - name: Mask installation token
        env:
          INSTALLATION_TOKEN: ${{ github.event.client_payload.installation_token }}
        run: |
          if [ -n "$INSTALLATION_TOKEN" ]; then
            echo "::add-mask::$INSTALLATION_TOKEN"
          fi

  review:
    name: Review PR
    needs: mask-token
    permissions:
      contents: read
      pull-requests: write
    uses: clouatre-labs/aptu-github-app/.github/workflows/pr-review.yml@3d3a227339de7384c7cef8b56325fe4d38ebcb94 # v0.1.4
    with:
      originating_repo: ${{ github.event.client_payload.originating_repo }}
      pull_number: ${{ github.event.client_payload.pull_number }}
      instructions_file: ${{ github.event.client_payload.instructions_file || '.github/instructions/pr-review.md' }}
      skip_labeled: ${{ github.event.client_payload.skip_labeled || false }}
      ai_provider: ${{ github.event.client_payload.ai_provider || 'openrouter' }}
      ai_model: ${{ github.event.client_payload.ai_model || 'google/gemma-4-26b-a4b-it' }}
      telemetry_enabled: ${{ github.event.client_payload.telemetry_enabled || false }}
    secrets:
      ai-api-key: >-
        ${{ (github.event.client_payload.ai_provider == 'anthropic' && secrets.ANTHROPIC_API_KEY)
         || (github.event.client_payload.ai_provider == 'gemini' && secrets.GEMINI_API_KEY)
         || secrets.OPENROUTER_API_KEY }}
      installation-token: ${{ github.event.client_payload.installation_token }}
