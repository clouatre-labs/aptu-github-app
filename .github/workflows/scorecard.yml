name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Scorecard CLI
        env:
          VERSION: "5.5.0"
          SHA256: "3ce59d20c1d53e540c4a14e0da1e0d96b3b294e8ddc96a3c5a7b8a637b32991e"
        run: |
          curl -fsSL "https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_arm64.tar.gz" \
            -o scorecard.tar.gz
          echo "${SHA256}  scorecard.tar.gz" | sha256sum -c -
          tar -xzf scorecard.tar.gz

      - name: Run OpenSSF Scorecard
        env:
          ENABLE_SARIF: "1"
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scorecard --repo=github.com/clouatre-labs/aptu-github-app --format=sarif --show-details > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: results.sarif
