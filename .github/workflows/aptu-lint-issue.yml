name: Aptu Lint Issue

on:
  repository_dispatch:
    types:
      - aptu-lint-issue

jobs:
  lint:
    name: Lint Issue
    permissions:
      contents: read
      issues: write
    # Transitional pin: this SHA predates lint-issue.yml and must be repinned
    # to the tag containing this PR in the release follow-up.
    uses: clouatre-labs/aptu-github-app/.github/workflows/lint-issue.yml@d341c5f20e31b570db8a10136d56ca63af6ded7b # v0.1.8
    with:
      originating_repo: ${{ github.event.client_payload.originating_repo }}
      issue_number: ${{ github.event.client_payload.issue_number }}
      issue_body: ${{ github.event.client_payload.issue_body }}
      lint_spec: ${{ github.event.client_payload.lint_spec || '' }}
    secrets:
      installation-token: ${{ github.event.client_payload.installation_token }}
