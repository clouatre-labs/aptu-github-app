name: Lint Markdown

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Lint markdown
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint markdown
        run: bunx markdownlint-cli2@0.23.1 '**/*.md'
