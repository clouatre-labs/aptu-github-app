name: Triage New Issues

on:
  repository_dispatch:
    types: [aptu-triage]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Run Aptu issue triage
        uses: clouatre-labs/aptu@f607469bc1b9073c85ee19f6dd2ef0d24c736815 # v0.10.4
        with:
          github-token: ${{ github.event.client_payload.installation_token }}
          gemini-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] || secrets.GEMINI_API_KEY }}
          provider: ${{ github.event.client_payload.ai_provider || 'gemini' }}
          model: ${{ github.event.client_payload.ai_model || 'gemini-3.1-flash-lite' }}
          no-comment: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          repo: ${{ github.event.client_payload.originating_repo }}
          issue-number: ${{ github.event.client_payload.issue_number }}
