name: Triage New Issues

on:
  repository_dispatch:
    types: [aptu-triage]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.originating_owner }}
          repositories: ${{ github.event.client_payload.originating_repo_name }}
          permission-contents: read
          permission-issues: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Aptu issue triage
        uses: clouatre-labs/aptu@df65cafeae382345ca32b40c1a0e99b1eba162ef # v0.10.12
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          gemini-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] }}
          provider: ${{ github.event.client_payload.ai_provider || 'openrouter' }}
          model: ${{ github.event.client_payload.ai_model || 'google/gemma-4-26b-a4b-it' }}
          no-comment: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          repo: ${{ github.event.client_payload.originating_repo }}
          issue-number: ${{ github.event.client_payload.issue_number }}
