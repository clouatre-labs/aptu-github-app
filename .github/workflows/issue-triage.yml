name: Triage New Issues

on:
  repository_dispatch:
    types: [aptu-triage]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mask installation token
        run: echo "::add-mask::${{ github.event.client_payload.installation_token }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Aptu issue triage
        uses: clouatre-labs/aptu@df65cafeae382345ca32b40c1a0e99b1eba162ef # v0.10.12
        with:
          github-token: ${{ github.event.client_payload.installation_token }}
          gemini-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] }}
          provider: ${{ github.event.client_payload.ai_provider || 'gemini' }}
          model: ${{ github.event.client_payload.ai_model || 'gemini-3.1-flash-lite' }}
          no-comment: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          repo: ${{ github.event.client_payload.originating_repo }}
          issue-number: ${{ github.event.client_payload.issue_number }}
