name: Triage New Issues

on:
  workflow_call:
    inputs:
      originating_repo:
        required: true
        type: string
      issue_number:
        required: true
        type: number
      ai_provider:
        required: false
        type: string
        default: 'openrouter'
      ai_model:
        required: false
        type: string
        default: 'google/gemma-4-26b-a4b-it'
    secrets:
      ai-api-key:
        required: false

permissions: {}

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Aptu issue triage
        uses: clouatre-labs/aptu@df65cafeae382345ca32b40c1a0e99b1eba162ef # v0.10.12
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ai-api-key }}
          gemini-api-key: ${{ secrets.ai-api-key }}
          openrouter-api-key: ${{ secrets.ai-api-key }}
          provider: ${{ inputs.ai_provider }}
          model: ${{ inputs.ai_model }}
          no-comment: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          repo: ${{ inputs.originating_repo }}
          issue-number: ${{ inputs.issue_number }}
