name: Scan Security

on:
  repository_dispatch:
    types: [aptu-scan-security]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan Security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate payload
        id: validate
        env:
          ORIGINATING_REPO: ${{ github.event.client_payload.originating_repo }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          PULL_NUMBER: ${{ github.event.client_payload.pull_number }}
        run: |
          GITHUB_NAME_RE='^[a-zA-Z0-9]([a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?$'
          ORIGINATING_OWNER="${ORIGINATING_REPO%%/*}"
          ORIGINATING_REPO_NAME="${ORIGINATING_REPO#*/}"
          if [[ "${ORIGINATING_REPO}" != *"/"* || -z "${ORIGINATING_OWNER}" || -z "${ORIGINATING_REPO_NAME}" || ! "${ORIGINATING_OWNER}" =~ ${GITHUB_NAME_RE} ]]; then
            echo "::error::Invalid originating_owner: ${ORIGINATING_OWNER}"
            exit 1
          fi
          if [[ ! "${ORIGINATING_REPO_NAME}" =~ ${GITHUB_NAME_RE} ]]; then
            echo "::error::Invalid originating_repo_name: ${ORIGINATING_REPO_NAME}"
            exit 1
          fi
          if [[ ! "${PULL_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull_number: ${PULL_NUMBER}"
            exit 1
          fi
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid head_sha: ${HEAD_SHA}"
            exit 1
          fi

          echo "originating_repo=${ORIGINATING_REPO}" >> "${GITHUB_OUTPUT}"
          echo "owner=${ORIGINATING_OWNER}" >> "${GITHUB_OUTPUT}"
          echo "repo_name=${ORIGINATING_REPO_NAME}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "pull_number=${PULL_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.validate.outputs.owner }}
          repositories: ${{ steps.validate.outputs.repo_name }}
          permission-contents: read
          permission-security-events: write
          permission-statuses: write

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.validate.outputs.originating_repo }}
          ref: ${{ steps.validate.outputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Aptu security scan
        id: scan
        uses: clouatre-labs/aptu@df65cafeae382345ca32b40c1a0e99b1eba162ef # v0.10.12
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          scan-path: ${{ github.event.client_payload.scan_path || '.' }}
          fail-on: ${{ github.event.client_payload.fail_on }}
          sarif-upload: 'false'

      - name: Upload SARIF to caller
        id: upload-sarif
        if: always() && hashFiles('findings.sarif') != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGINATING_REPO: ${{ steps.validate.outputs.originating_repo }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          PULL_NUMBER: ${{ steps.validate.outputs.pull_number }}
        run: |
          SARIF_B64="$(gzip -c findings.sarif | base64 -w0)"
          if gh api "repos/${ORIGINATING_REPO}/code-scanning/sarifs" \
            --method POST \
            -f "commit_sha=${HEAD_SHA}" \
            -f "ref=refs/pull/${PULL_NUMBER}/head" \
            -f "sarif=$SARIF_B64"; then
            echo "upload_status=succeeded" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::SARIF API upload failed (Code Security may not be enabled on ${ORIGINATING_REPO}); SARIF will be available as a workflow artifact"
            echo "upload_status=skipped" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload SARIF artifact
        if: always() && hashFiles('findings.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-sarif
          path: findings.sarif
          retention-days: 30

      - name: Report status to caller
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGINATING_REPO: ${{ steps.validate.outputs.originating_repo }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          PULL_NUMBER: ${{ steps.validate.outputs.pull_number }}
          VALIDATE_CONCLUSION: ${{ steps.validate.conclusion }}
          APP_TOKEN_CONCLUSION: ${{ steps.app-token.conclusion }}
          SCAN_CONCLUSION: ${{ steps.scan.conclusion }}
          UPLOAD_STATUS: ${{ steps.upload-sarif.outputs.upload_status }}
          UPLOAD_CONCLUSION: ${{ steps.upload-sarif.conclusion }}
        run: |
          if [[ -z "${GH_TOKEN}" || "${APP_TOKEN_CONCLUSION}" != "success" ]]; then
            echo "No installation token available; skipping status report"
            exit 0
          fi

          TARGET_URL="https://github.com/${ORIGINATING_REPO}/pull/${PULL_NUMBER}"

          if [[ "${VALIDATE_CONCLUSION}" != "success" ]]; then
            STATE="failure"
            DESC="aptu security scan encountered an error (invalid payload)"
          elif [[ "${SCAN_CONCLUSION}" == "failure" ]]; then
            STATE="failure"
            DESC="aptu security scan found issues"
          elif [[ "${SCAN_CONCLUSION}" == "success" ]]; then
            STATE="success"
            DESC="aptu security scan passed"
          else
            STATE="failure"
            DESC="aptu security scan did not complete"
          fi

          gh api "repos/${ORIGINATING_REPO}/statuses/${HEAD_SHA}" \
            --method POST \
            -f state="$STATE" \
            -f context="aptu-scan-security" \
            -f description="$DESC" \
            -f target_url="${TARGET_URL}"
