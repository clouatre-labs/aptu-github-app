name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'worker/**'
              - 'biome.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: Biome check
        run: bunx biome check .
      - name: Dependency audit
        # GHSA-r28c-9q8g-f849: postcss path traversal -- pinned by vite (vitest dep); devOnly, not deployed
        # GHSA-4cwx-7wf7-3272: undici info disclosure -- pinned by miniflare (wrangler dep); devOnly, not deployed
        run: bun audit --audit-level high --ignore GHSA-r28c-9q8g-f849 --ignore GHSA-4cwx-7wf7-3272

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: TypeScript type check
        run: bun run --cwd worker tsc --noEmit

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install commitlint
        run: bun add -D @commitlint/cli@21.2.1 @commitlint/config-conventional@21.2.0
      - name: Validate commit messages
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check-base:
    name: Check Branch Base
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify branch is up-to-date with main
        run: |
          git fetch origin main
          base_commit=$(git merge-base origin/main HEAD)
          main_head=$(git rev-parse origin/main)
          if [ "$base_commit" != "$main_head" ]; then
            behind=$(git rev-list --count "$base_commit".."$main_head")
            echo "::error::Branch is $behind commit(s) behind main. Please update your branch with the latest main."
            echo "Run: git fetch origin && git rebase origin/main  # or merge: git fetch origin && git merge origin/main"
            exit 1
          fi

  verify-dispatcher-pins:
    name: Verify Dispatcher Pins
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify dispatcher pins are updated alongside reusable workflow changes
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          declare -A dispatcher_for=(
            [".github/workflows/pr-review.yml"]=".github/workflows/aptu-review.yml"
            [".github/workflows/issue-triage.yml"]=".github/workflows/aptu-triage.yml"
            [".github/workflows/scan-security.yml"]=".github/workflows/aptu-scan-security.yml"
          )
          fail=0
          for target in "${!dispatcher_for[@]}"; do
            dispatcher="${dispatcher_for[$target]}"
            if grep -qxF "$target" <<< "$changed" && ! grep -qxF "$dispatcher" <<< "$changed"; then
              echo "::error file=$dispatcher::$target changed but $dispatcher was not updated -- bump its SHA pin in this PR or the next dispatch will fail with startup_failure"
              fail=1
            fi
          done
          exit $fail

  ci-result:
    name: CI Result
    runs-on: ubuntu-24.04-arm
    if: always()
    needs: [lint, typecheck, test, commitlint, check-base, verify-dispatcher-pins]
    permissions: {}
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."