name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'worker/**'
              - 'biome.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: Biome check
        run: bunx biome check .
      - name: Dependency audit
        # GHSA-r28c-9q8g-f849: postcss path traversal -- pinned by vite (vitest dep); devOnly, not deployed
        # GHSA-4cwx-7wf7-3272: undici info disclosure -- pinned by miniflare (wrangler dep); devOnly, not deployed
        run: bun audit --audit-level high --ignore GHSA-r28c-9q8g-f849 --ignore GHSA-4cwx-7wf7-3272

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: TypeScript type check
        run: bun run --cwd worker tsc --noEmit

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install commitlint
        run: bun add -D @commitlint/cli@21.2.1 @commitlint/config-conventional@21.2.0
      - name: Validate commit messages
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check-base:
    name: Check Branch Base
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify branch is up-to-date with main
        run: |
          git fetch origin main
          base_commit=$(git merge-base origin/main HEAD)
          main_head=$(git rev-parse origin/main)
          if [ "$base_commit" != "$main_head" ]; then
            behind=$(git rev-list --count "$base_commit".."$main_head")
            echo "::error::Branch is $behind commit(s) behind main. Please update your branch with the latest main."
            echo "Run: git fetch origin && git rebase origin/main  # or merge: git fetch origin && git merge origin/main"
            exit 1
          fi

  marker-check:
    name: Check Workflow Version Marker
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version marker bump on reusable workflow changes
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # Check if any of the three reusable workflow files changed
          changed_workflows=$(git diff --name-only "$base_sha" "$head_sha" -- \
            .github/workflows/pr-review.yml \
            .github/workflows/issue-triage.yml \
            .github/workflows/scan-security.yml)

          if [ -z "$changed_workflows" ]; then
            echo "No reusable workflows changed. Version marker check skipped."
            exit 0
          fi

          echo "Reusable workflow files changed:"
          echo "$changed_workflows"

          # Extract marker integer from aptu.yml at base and HEAD
          old_marker_line=$(git show "$base_sha:.github/workflows/aptu.yml" 2>/dev/null | grep -E '^# aptu-dispatch-handler-version: [0-9]+$' || true)
          old_marker=$(echo "$old_marker_line" | awk '{print $NF}')
          if [ -z "$old_marker" ]; then
            old_marker=0
          fi

          new_marker_line=$(git show "$head_sha:.github/workflows/aptu.yml" 2>/dev/null | grep -E '^# aptu-dispatch-handler-version: [0-9]+$' || true)
          new_marker=$(echo "$new_marker_line" | awk '{print $NF}')

          if [ -z "$new_marker" ]; then
            echo "::error::Reusable workflows were modified, but .github/workflows/aptu.yml does not contain a valid '# aptu-dispatch-handler-version: <integer>' marker."
            exit 1
          fi

          echo "Base marker version: $old_marker"
          echo "Head marker version: $new_marker"

          if [ "$new_marker" -le "$old_marker" ]; then
            echo "::error::Reusable workflows were modified, but aptu-dispatch-handler-version was not incremented (base: $old_marker, head: $new_marker). Please increment the version marker in .github/workflows/aptu.yml and README.md template."
            exit 1
          fi

          echo "Version marker successfully incremented from $old_marker to $new_marker."

  ci-result:
    name: CI Result
    runs-on: ubuntu-24.04-arm
    if: always()
    needs: [lint, typecheck, test, commitlint, check-base, marker-check]
    permissions: {}
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."