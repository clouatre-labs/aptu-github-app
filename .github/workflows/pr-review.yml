name: Triage Pull Requests

on:
  workflow_call:
    inputs:
      originating_repo:
        required: true
        type: string
      pull_number:
        required: true
        type: number
      instructions_file:
        required: false
        type: string
        default: '.github/instructions/pr-review.md'
      skip_labeled:
        required: false
        type: boolean
        default: false
      ai_provider:
        required: false
        type: string
        default: 'openrouter'
      ai_model:
        required: false
        type: string
        default: 'google/gemma-4-26b-a4b-it'
      app_id:
        required: true
        type: string
    secrets:
      ai-api-key:
        required: false
      app-private-key:
        required: true

permissions: {}

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Parse originating repo
        id: parse-repo
        env:
          ORIGINATING_REPO: ${{ inputs.originating_repo }}
        run: |
          echo "owner=${ORIGINATING_REPO%%/*}" >> "${GITHUB_OUTPUT}"
          echo "repo_name=${ORIGINATING_REPO#*/}" >> "${GITHUB_OUTPUT}"

      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          repositories: ${{ steps.parse-repo.outputs.repo_name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review PR
        uses: clouatre-labs/aptu@5f6571cb58b139159c752eda3085368f7f2fc33c # v0.10.14
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          anthropic-api-key: ${{ secrets.ai-api-key }}
          gemini-api-key: ${{ secrets.ai-api-key }}
          openrouter-api-key: ${{ secrets.ai-api-key }}
          provider: ${{ inputs.ai_provider }}
          model: ${{ inputs.ai_model }}
          skip-labeled: ${{ inputs.skip_labeled }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: ${{ inputs.instructions_file }}
          repo-path: ${{ github.workspace }}
          repo: ${{ inputs.originating_repo }}
          pull-number: ${{ inputs.pull_number }}
          max-prompt-chars: '200000'
          max-full-content-files: '0'
