name: Triage Pull Requests

on:
  repository_dispatch:
    types: [aptu-review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mask installation token
        run: echo "::add-mask::${{ github.event.client_payload.installation_token }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review PR
        uses: clouatre-labs/aptu@83226816caaec41ee93af5e1ca7c974b76de35ba # v0.10.9
        continue-on-error: true
        with:
          github-token: ${{ github.event.client_payload.installation_token }}
          anthropic-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] }}
          gemini-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] }}
          openrouter-api-key: ${{ secrets[github.event.client_payload.ai_key_secret] }}
          provider: ${{ github.event.client_payload.ai_provider || 'gemini' }}
          model: ${{ github.event.client_payload.ai_model || 'gemini-3.1-flash-lite' }}
          skip-labeled: ${{ github.event.client_payload.skip_labeled }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: ${{ github.event.client_payload.instructions_file || '.github/instructions/pr-review.md' }}
          repo-path: ${{ github.workspace }}
          repo: ${{ github.event.client_payload.originating_repo }}
          pull-number: ${{ github.event.client_payload.pull_number }}
          max-prompt-chars: '200000'
          max-full-content-files: '0'