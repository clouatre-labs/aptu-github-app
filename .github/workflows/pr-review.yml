name: Triage Pull Requests

on:
  repository_dispatch:
    types: [aptu-review]
  workflow_dispatch:
    inputs:
      originating_repo:
        required: true
        description: 'Repository in owner/repo format'
      pull_number:
        required: true
        description: 'PR number'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo || github.event.inputs.originating_repo }}-${{ github.event.client_payload.pull_number || github.event.inputs.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ORIGINATING_REPO: ${{ github.event.client_payload.originating_repo || github.event.inputs.originating_repo }}
      PULL_NUMBER: ${{ github.event.client_payload.pull_number || github.event.inputs.pull_number }}
      INSTALLATION_TOKEN: ${{ github.event.client_payload.installation_token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Install aptu CLI
        run: |
          mkdir -p /tmp/aptu-bin
          cd /tmp/aptu-bin
          curl -fsSL https://github.com/clouatre-labs/aptu/releases/download/v0.10.1/aptu-aarch64-unknown-linux-musl.tar.gz -o aptu.tar.gz
          tar xzf aptu.tar.gz
          mv aptu /usr/local/bin/aptu
          chmod +x /usr/local/bin/aptu
          rm -rf /tmp/aptu-bin

      - name: Review PR
        env:
          GH_TOKEN: ${{ env.INSTALLATION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APTU_AI__PROVIDER: gemini
          APTU_AI__MODEL: gemini-3.1-flash-lite
        run: |
          aptu pr review --comment --force ${{ env.ORIGINATING_REPO }}#${{ env.PULL_NUMBER }}
        continue-on-error: true
