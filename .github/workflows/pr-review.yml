name: Triage Pull Requests

on:
  repository_dispatch:
    types: [aptu-review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Review PR
        uses: clouatre-labs/aptu@fa3d8ce38808061bc5593c3ca1e791c73d0f72c6 # v0.10.2
        continue-on-error: true
        with:
          github-token: ${{ github.event.client_payload.installation_token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: gemini
          model: gemini-3.1-flash-lite
          skip-labeled: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: .github/instructions/pr-review.md
          repo-path: ${{ github.workspace }}
          repo: ${{ github.event.client_payload.originating_repo }}
          pull-number: ${{ github.event.client_payload.pull_number }}
