name: Triage Pull Requests

on:
  repository_dispatch:
    types: [aptu-review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.originating_repo }}-${{ github.event.client_payload.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.originating_owner }}
          repositories: ${{ github.event.client_payload.originating_repo_name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review PR
        uses: clouatre-labs/aptu@df65cafeae382345ca32b40c1a0e99b1eba162ef # v0.10.12
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          anthropic-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          gemini-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: ${{ github.event.client_payload.ai_provider || 'openrouter' }}
          model: ${{ github.event.client_payload.ai_model || 'google/gemma-4-26b-a4b-it' }}
          skip-labeled: ${{ github.event.client_payload.skip_labeled }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: ${{ github.event.client_payload.instructions_file || '.github/instructions/pr-review.md' }}
          repo-path: ${{ github.workspace }}
          repo: ${{ github.event.client_payload.originating_repo }}
          pull-number: ${{ github.event.client_payload.pull_number }}
          max-prompt-chars: '200000'
          max-full-content-files: '0'
