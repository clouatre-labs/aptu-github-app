name: Triage Pull Requests

on:
  workflow_call:
    inputs:
      originating_repo:
        required: true
        type: string
      pull_number:
        required: true
        type: number
      instructions_file:
        required: false
        type: string
        default: '.github/instructions/pr-review.md'
      skip_labeled:
        required: false
        type: boolean
        default: false
      ai_provider:
        required: false
        type: string
        default: 'openrouter'
      ai_model:
        required: false
        type: string
        default: 'google/gemma-4-26b-a4b-it'
      telemetry_enabled:
        required: false
        type: boolean
        default: false
    secrets:
      ai-api-key:
        required: false
      installation-token:
        required: true

permissions: {}

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review PR
        uses: clouatre-labs/aptu@1be4790e946729a892623577b0f18b3be28d1d72 # v0.10.18
        continue-on-error: true
        with:
          github-token: ${{ secrets.installation-token }}
          anthropic-api-key: ${{ secrets.ai-api-key }}
          gemini-api-key: ${{ secrets.ai-api-key }}
          openrouter-api-key: ${{ secrets.ai-api-key }}
          provider: ${{ inputs.ai_provider }}
          model: ${{ inputs.ai_model }}
          skip-labeled: ${{ inputs.skip_labeled }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: ${{ inputs.instructions_file }}
          repo-path: ${{ github.workspace }}
          repo: ${{ inputs.originating_repo }}
          pull-number: ${{ inputs.pull_number }}
          max-prompt-chars: '200000'
          max-full-content-files: '0'
          telemetry-rollup: ${{ inputs.telemetry_enabled }}

      - name: Report telemetry rollup
        if: inputs.telemetry_enabled
        continue-on-error: true
        run: |
          (tail -n 1 .aptu/telemetry-rollup.jsonl 2>/dev/null || true) | \
            curl -sf -X POST https://aptu.dev/telemetry/rollup \
              -H 'Content-Type: application/json' \
              --data-binary @- >/dev/null 2>&1 || true
