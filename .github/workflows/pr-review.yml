name: Triage Pull Requests

on:
  workflow_call:
    inputs:
      originating_repo:
        required: true
        type: string
      pull_number:
        required: true
        type: number
      instructions_file:
        required: false
        type: string
        default: '.github/instructions/pr-review.md'
      skip_labeled:
        required: false
        type: boolean
        default: false
      ai_provider:
        required: false
        type: string
        default: 'openrouter'
      ai_model:
        required: false
        type: string
        default: 'google/gemma-4-26b-a4b-it'
      telemetry_enabled:
        required: false
        type: boolean
        default: false
    secrets:
      ai-api-key:
        required: false
      installation-token:
        required: true

permissions: {}

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mask installation token
        env:
          INSTALLATION_TOKEN: ${{ secrets.installation-token }}
        run: |
          if [ -n "$INSTALLATION_TOKEN" ]; then
            echo "::add-mask::$INSTALLATION_TOKEN"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review PR
        id: review
        uses: clouatre-labs/aptu@9ea28ff3ee8c9e9f2d5329fdf7298ee12353336b # v0.12.4
        continue-on-error: true
        with:
          github-token: ${{ secrets.installation-token }}
          anthropic-api-key: ${{ secrets.ai-api-key }}
          gemini-api-key: ${{ secrets.ai-api-key }}
          openrouter-api-key: ${{ secrets.ai-api-key }}
          provider: ${{ inputs.ai_provider }}
          model: ${{ inputs.ai_model }}
          skip-labeled: ${{ inputs.skip_labeled }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          instructions-file: ${{ inputs.instructions_file }}
          repo-path: ${{ github.workspace }}
          repo: ${{ inputs.originating_repo }}
          pull-number: ${{ inputs.pull_number }}
          max-prompt-chars: '200000'
          max-full-content-files: '0'
          telemetry-rollup: ${{ inputs.telemetry_enabled }}

      - name: Summarize review outcome
        if: always() && steps.review.outputs.pr-review-outcome != 'success'
        env:
          PR_REVIEW_OUTCOME: ${{ steps.review.outputs.pr-review-outcome }}
        run: |
          echo "::warning::AI review step did not succeed (outcome: ${PR_REVIEW_OUTCOME:-unknown}; continue-on-error kept the job green) - check the Review PR step logs"
          echo "### :warning: AI review ${PR_REVIEW_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "The Review PR step did not succeed but did not block this job (continue-on-error: true). See the Review PR step logs for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Report telemetry rollup
        if: inputs.telemetry_enabled
        run: |
          line="$(tail -n 1 .aptu/telemetry-rollup.jsonl 2>/dev/null || true)"
          if [ -z "$line" ] || ! printf '%s' "$line" | jq -e . >/dev/null 2>&1; then
            echo "::warning::Skipping telemetry rollup POST: last line of .aptu/telemetry-rollup.jsonl is missing or not valid JSON (likely truncated)"
            exit 0
          fi
          printf '%s' "$line" | \
            curl -sf -X POST https://aptu.dev/telemetry/rollup \
              -H 'Content-Type: application/json' \
              --data-binary @- >/dev/null
