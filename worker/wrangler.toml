name = "aptu-webhook"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[[routes]]
pattern = "aptu.dev/webhook"
zone_name = "aptu.dev"

[[routes]]
pattern = "aptu.dev/telemetry/rollup"
zone_name = "aptu.dev"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "InstallationQuota"

[[durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

[[durable_objects.bindings]]
name = "TELEMETRY"
class_name = "TelemetryRollup"

[[durable_objects.bindings]]
name = "TELEMETRY_RATE_LIMIT"
class_name = "TelemetryRateLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstallationQuota"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReplayGuard"]

[[migrations]]
tag = "v4"
deleted_classes = ["GlobalQuota"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TelemetryRollup"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["TelemetryRateLimit"]

[vars]
# SENTRY_DSN = ""  # Set via: bunx wrangler secret put SENTRY_DSN
# The SENTRY_DSN is used for error tracking via @sentry/cloudflare.
# After deploy, set the production value with: bunx wrangler secret put SENTRY_DSN
APP_ID = "4134521"
# aptu-dev[bot] user ID -- verified via: gh api /users/aptu-dev%5Bbot%5D
APTU_BOT_ID = "296574906"
# Operator's own org -- exempt from quota enforcement (see quota.ts). aptu-dev has a
# single org-wide installation for clouatre-labs, so the per-installation quota is
# effectively an org-wide bucket; quota's remaining purpose is abuse protection for
# untrusted external installations, not the operator's own repos.
OPERATOR_ORG = "clouatre-labs"
# Secrets (set post-deploy via CLI):
#   bunx wrangler secret put WEBHOOK_SECRET
#   bunx wrangler secret put APP_PRIVATE_KEY
# APP_PRIVATE_KEY must be PKCS#8 format PEM. GitHub downloads the App's private key in
# PKCS#1 format; convert it first (@octokit/auth-app requires PKCS#8 for its WebCrypto
# API-based JWT signing):
#   openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in private-key.pem -out private-key-pkcs8.key
# After deploy: update aptu-dev App manifest to add Contents:Write permission
# and re-authorize existing installations before repository_dispatch will succeed.
